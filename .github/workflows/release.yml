name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - runner: ubuntu-24.04-arm
            arch: aarch64
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    env:
      ARCH: ${{ matrix.arch }}
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
      ZIG_VERSION: 0.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev pkg-config python3

      - name: Install Zig
        working-directory: ${{ runner.temp }}
        run: |
          archive="zig-${ARCH}-linux-${ZIG_VERSION}.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          tar -xf "$archive"
          echo "$RUNNER_TEMP/zig-${ARCH}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Test and build
        run: |
          zig fmt --check zig build.zig
          zig build test --summary all
          zig build -Doptimize=ReleaseSafe -Dcpu=baseline --summary all
          ldd zig-out/bin/c2c
          readelf --version-info zig-out/bin/c2c

      - name: Package and smoke test
        run: |
          mkdir -p dist "$RUNNER_TEMP/package" "$RUNNER_TEMP/extracted"
          install -m755 zig-out/bin/c2c "$RUNNER_TEMP/package/c2c"
          cp LICENSE README.md "$RUNNER_TEMP/package/"
          cp -R docs "$RUNNER_TEMP/package/docs"
          printf 'version=%s\ncommit=%s\ntarget=linux-%s\nzig=%s\n' \
            "$VERSION" "$GITHUB_SHA" "$ARCH" "$ZIG_VERSION" > "$RUNNER_TEMP/package/BUILD_INFO"
          archive="dist/c2c-${VERSION}-linux-${ARCH}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/package" c2c LICENSE README.md docs BUILD_INFO
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"
          python3 tests/release_smoke.py "$RUNNER_TEMP/extracted/c2c"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Publish release
        working-directory: dist
        run: |
          archives=("c2c-${TAG}-linux-x86_64.tar.gz" "c2c-${TAG}-linux-aarch64.tar.gz")
          for archive in "${archives[@]}"; do test -s "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --verify-tag --draft --title "c2c $TAG" \
              --notes "Linux x86_64 and ARM64 builds. Requires glibc and libsqlite3; see the README for installation. Check downloads against SHA256SUMS.txt."
          fi
          gh release upload "$TAG" "${archives[@]}" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
